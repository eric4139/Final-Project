<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musique 3000</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


<h1 style="text-align: center; font-family: fantasy;">Music 3000</h1>



<div id="Buttons">
  <button id="Red" class="PlayButton">Play Music</button>
  <button id="Blue" class="PlayButton">Play Music</button>
  <button id="Green" class="PlayButton">Play Music</button>
  <button id="Yellow" class="PlayButton">Play Music</button>
</div>


<div id="Mixes">

  <div class="mix" data-mix="1">
    <input type="checkbox"><input type="checkbox"><input type="checkbox"><input type="checkbox">
    <input type="checkbox"><input type="checkbox"><input type="checkbox"><input type="checkbox">
    <button class="valider">Valider mix 1</button>
  </div>


  <div class="mix" data-mix="2">
    <input type="checkbox"><input type="checkbox"><input type="checkbox"><input type="checkbox">
    <input type="checkbox"><input type="checkbox"><input type="checkbox"><input type="checkbox">
    <button class="valider">Valider mix 2</button>
  </div>


  <div class="mix" data-mix="3">
  <input type="checkbox"><input type="checkbox"><input type="checkbox"><input type="checkbox">
  <input type="checkbox"><input type="checkbox"><input type="checkbox"><input type="checkbox">
  <button class="valider">Valider mix 3</button>
  </div>


  <div class="mix" data-mix="4">
  <input type="checkbox"><input type="checkbox"><input type="checkbox"><input type="checkbox">
  <input type="checkbox"><input type="checkbox"><input type="checkbox"><input type="checkbox">
  <button class="valider">Valider mix 4</button>
  </div>

</div>








<input type="range" id="Slider" min="0" max="100" value="50">


</body> 
</html>
