<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Demo</title>
    <link rel="stylesheet" href="style.css" />
    <script src="truc.js" defer></script>
  </head>
  <body>
    <main class="app">
      <section class="card">
        <span class="badge">Quick demo</span>
        <h1>Build something amazing.</h1>
        <p>
          Fast, clean, and ready to ship — a simple concept to get your next idea moving.
        </p>

        <div class="actions">
          <button class="primary">Start now</button>
          <button class="secondary">Learn more</button>
        </div>

        <div class="stats">
          <div>
            <strong>24k</strong>
            <span>Users</span>
          </div>
          <div>
            <strong>4.9/5</strong>
            <span>Rating</span>
          </div>
          <div>
            <strong>3x</strong>
            <span>Faster</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
